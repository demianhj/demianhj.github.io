<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>预约 · Book a meeting</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --accent: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 48px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
  }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: #f0f0f0; color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 17px; flex-shrink: 0;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin: 3px 0 0; }
  .lang {
    display: flex; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; flex-shrink: 0;
  }
  .lang button {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 13px; font-size: 13px; color: var(--fg);
    font-family: inherit;
  }
  .lang button.active { background: var(--accent); color: #fff; }
  .intro { font-size: 14px; color: var(--muted); line-height: 1.7; margin: 0 0 24px; max-width: 560px; }
  .cal-embed {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    min-height: 640px;
  }
  footer {
    margin-top: 28px; font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--fg); }
  .tz-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin: 0 0 16px;
  }
  .tz-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .tz-btn {
    border: 1px solid var(--line); background: transparent; cursor: pointer;
    padding: 6px 12px; font-size: 13px; color: var(--fg);
    border-radius: 8px; font-family: inherit;
  }
  .tz-btn:hover { border-color: #b8b8b8; }
  .tz-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 560px) {
    header { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="who">
      <div class="avatar">JH</div>
      <div>
        <h1 id="t-name">Junwen Huang</h1>
        <p class="sub" id="t-role">选择会议时长与时段 · 在线</p>
      </div>
    </div>
    <div class="lang">
      <button id="lang-zh" class="active" onclick="setLang('zh')">中文</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <p class="intro" id="t-intro">
    选择一个对你方便的时段，下面的日历会实时显示我的空闲时间。确认后你会收到带视频链接的日历邀请。
  </p>

  <!-- 时区快捷选择 -->
  <div class="tz-row" id="tz-row">
    <span class="tz-label" id="t-tzlabel">时区 / Timezone:</span>
    <button class="tz-btn" data-tz="America/New_York">Boston (ET)</button>
    <button class="tz-btn" data-tz="America/Los_Angeles">LA (PT)</button>
    <button class="tz-btn" data-tz="Europe/Berlin">Germany (CET)</button>
    <button class="tz-btn" data-tz="Europe/London">UK (GMT)</button>
    <button class="tz-btn" data-tz="Asia/Shanghai">China (CST)</button>
  </div>

  <!-- Cal.com inline embed -->
  <div class="cal-embed">
    <div
      style="width:100%;height:100%;overflow:scroll"
      id="my-cal-inline"
    ></div>
  </div>

  <footer>
    <span id="t-foot">空闲时间由 Google 日历实时同步</span>
  </footer>

  <p style="margin-top:18px;">
    <a class="back" href="./" id="t-back">← 返回主页</a>
  </p>

</div>

<script>
/* ---------- 1. 语言切换 ---------- */
const STR = {
  zh: {
    title: "预约 · Book a meeting",
    role: "选择会议时长与时段 · 在线",
    intro: "先选择会议时长（15 或 30 分钟），再挑一个对你方便的时段。下面的日历会实时显示我的空闲时间，确认后你会收到带视频链接的日历邀请。",
    foot: "空闲时间由 Google 日历实时同步",
    back: "← 返回主页",
    tzlabel: "时区：",
    calLang: "zh-CN"
  },
  en: {
    title: "Book a meeting",
    role: "Pick duration & time · Online",
    intro: "Choose a meeting length (15 or 30 min), then pick a time that works for you. The calendar below shows my live availability. You'll get a calendar invite with a video link once confirmed.",
    foot: "Availability synced live from Google Calendar",
    back: "← Back to homepage",
    tzlabel: "Timezone:",
    calLang: "en"
  }
};

function setLang(lang) {
  const s = STR[lang];
  document.documentElement.lang = lang === "zh" ? "zh" : "en";
  document.title = s.title;
  document.getElementById("t-role").textContent = s.role;
  document.getElementById("t-intro").textContent = s.intro;
  document.getElementById("t-foot").textContent = s.foot;
  document.getElementById("t-back").textContent = s.back;
  document.getElementById("t-tzlabel").textContent = s.tzlabel;
  document.getElementById("lang-zh").classList.toggle("active", lang === "zh");
  document.getElementById("lang-en").classList.toggle("active", lang === "en");
  localStorage.setItem("bookingLang", lang);
  if (window.Cal) {
    Cal("ui", { hideEventTypeDetails: false, layout: "month_view" });
  }
}

/* ---------- 2. Cal.com 内嵌 ---------- */
/* 官方 embed 脚本 */
(function (C, A, L) {
  let p = function (a, ar) { a.q.push(ar); };
  let d = C.document;
  C.Cal = C.Cal || function () {
    let cal = C.Cal; let ar = arguments;
    if (!cal.loaded) {
      cal.ns = {}; cal.q = cal.q || [];
      d.head.appendChild(d.createElement("script")).src = A;
      cal.loaded = true;
    }
    if (ar[0] === L) {
      const api = function () { p(api, arguments); };
      const namespace = ar[1];
      api.q = api.q || [];
      if (typeof namespace === "string") {
        cal.ns[namespace] = cal.ns[namespace] || api;
        p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]);
      } else p(cal, ar);
      return;
    }
    p(cal, ar);
  };
})(window, "https://app.cal.com/embed/embed.js", "init");

Cal("init", { origin: "https://cal.com" });

/* 指向整个用户主页（不带会议类型），访客可自由选择时长 */
const CAL_LINK = "junwen-h-y39uce";

const savedLang = localStorage.getItem("bookingLang") || "zh";
const savedTz = localStorage.getItem("bookingTz") || "";

/* ---------- 2. 渲染日历（可带时区） ---------- */
function renderCal(tz) {
  const container = document.getElementById("my-cal-inline");
  container.innerHTML = "";

  const config = { theme: "light", layout: "month_view" };
  if (tz) config.timeZone = tz;

  Cal("inline", {
    elementOrSelector: "#my-cal-inline",
    calLink: CAL_LINK,
    layout: "month_view",
    config: config
  });

  Cal("ui", {
    hideEventTypeDetails: false,
    layout: "month_view"
  });
}

/* ---------- 3. 时区快捷选择 ---------- */
function applyTimezone(tz) {
  document.querySelectorAll(".tz-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tz") === tz);
  });
  localStorage.setItem("bookingTz", tz);
  renderCal(tz);
}

document.querySelectorAll(".tz-btn").forEach(function (b) {
  b.addEventListener("click", function () {
    applyTimezone(b.getAttribute("data-tz"));
  });
});

/* 首次渲染：有保存过的时区就用它，否则让 Cal 自动按浏览器时区 */
renderCal(savedTz);
if (savedTz) {
  document.querySelectorAll(".tz-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tz") === savedTz);
  });
}

setLang(savedLang);
</script>
</body>
</html>
